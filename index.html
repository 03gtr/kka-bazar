<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef8f6">
<meta name="description" content="KKA BAZAR — دوغات | كل احتياجاتك.. بمكان واحد">
<title>KKA BAZAR | دوغات</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#edf7f5}
body{font-family:Arial,"Noto Sans Arabic",sans-serif;display:flex;justify-content:center}
.card{position:relative;width:min(100vw,920px);aspect-ratio:920/1632;overflow:hidden;background:#fff}
.card>img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border-radius:24px;cursor:pointer;outline:none}
.hotspot:active{background:rgba(255,255,255,.12)}
.call{left:8.4%;top:57.0%;width:39.7%;height:7.2%}
.location{left:51.8%;top:57.0%;width:39.8%;height:7.2%}
.instagram{left:8.6%;top:65.4%;width:19.7%;height:9.6%}
.facebook{left:30.1%;top:65.4%;width:19.7%;height:9.6%}
.tiktok{left:51.7%;top:65.4%;width:19.7%;height:9.6%}
.snapchat{left:73.0%;top:65.4%;width:18.8%;height:9.6%}
.share{left:25.5%;top:75.8%;width:49.0%;height:5.2%;border-radius:28px}
.powered{left:38%;top:95.8%;width:24%;height:2.5%}
@media(min-width:921px){body{padding:20px 0}.card{border-radius:28px;box-shadow:0 20px 70px rgba(0,50,48,.22)}}
@media(prefers-reduced-motion:reduce){.hotspot{transition:none}}
</style>
</head>
<body>
<main class="card" aria-label="KKA BAZAR digital social card">
<img src="card-reference.png" alt="KKA BAZAR — دوغات">
<a class="hotspot call" href="tel:07507927364" aria-label="اتصل بنا"></a>
<a class="hotspot location" href="#" aria-label="الموقع قريباً" onclick="return false"></a>
<a class="hotspot instagram" href="https://www.instagram.com/kka_bazar/" target="_blank" rel="noopener" aria-label="Instagram"></a>
<a class="hotspot facebook" href="https://www.facebook.com/share/1DVpqmY2wB/" target="_blank" rel="noopener" aria-label="Facebook"></a>
<a class="hotspot tiktok" href="https://www.tiktok.com/@kka_bazar" target="_blank" rel="noopener" aria-label="TikTok"></a>
<a class="hotspot snapchat" href="https://snapchat.com/t/geBRF11D" target="_blank" rel="noopener" aria-label="Snapchat"></a>
<button class="hotspot share" type="button" aria-label="مشاركة بطاقة KKA BAZAR"></button>
<a class="hotspot powered" href="https://iq-group.app" target="_blank" rel="noopener" aria-label="IQ Group"></a>
</main>
<script>
document.querySelector('.share').addEventListener('click',async()=>{
 const data={title:'KKA BAZAR | دوغات',text:'KKA BAZAR — كل احتياجاتك.. بمكان واحد.',url:location.href};
 try{
  if(navigator.share) await navigator.share(data);
  else {await navigator.clipboard.writeText(location.href); alert('تم نسخ رابط البطاقة');}
 }catch(e){}
});
</script>
</body>
</html>
